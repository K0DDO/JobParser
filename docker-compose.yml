services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobparser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobparser_secret}
      POSTGRES_DB: ${POSTGRES_DB:-jobparser}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobparser} -d ${POSTGRES_DB:-jobparser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jobparser:jobparser_secret@postgres:5432/jobparser}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      HH_ACCESS_TOKEN: ${HH_ACCESS_TOKEN:-}
      HH_USER_AGENT: ${HH_USER_AGENT:-JobParserLocal/1.0 (personal; your.email@mail.ru)}
      HH_CLIENT_ID: ${HH_CLIENT_ID:-}
      HH_CLIENT_SECRET: ${HH_CLIENT_SECRET:-}
      HH_REDIRECT_URI: ${HH_REDIRECT_URI:-http://localhost:8000/api/v1/auth/hh/callback}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  redis_data:
