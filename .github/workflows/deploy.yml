name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -T -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
            "export DEPLOY_PATH=$(printf %q "${VPS_DEPLOY_PATH}"); bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "== deploy $(pwd) =="

          # Bind-mount pycache is owned by root inside the container — free it first.
          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.prod.yml stop backend || true
          else
            docker compose stop backend || true
          fi
          sudo find . -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          sudo find . -type f -name '*.pyc' -delete 2>/dev/null || true
          sudo chown -R "$(whoami):$(whoami)" . || true

          git fetch origin main
          git reset --hard origin/main

          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          else
            docker compose up -d --build
            docker compose ps
          fi
          REMOTE
